name: Build gyroicons

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir build && cd build
          cmake ..
          make -j2
      - uses: actions/upload-artifact@v4
        with:
          name: gyroicons
          path: build/gyroicons.suprx
